[build]
  command = "npm run build:h5"
  publish = "dist/build/h5"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/question-generate"
  to = "/.netlify/functions/question-generate"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
